<title>First Rep Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow phone column, sticky header, fixed tab bar; the gym-floor palette is concrete grey, plate blue and plate yellow. */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F4F6F8;
  --ink: #13171C;
  --muted: #5A6570;
  --line: #D5DBE1;
  --accent: #1F4FD1;
  --accent-ink: #FFFFFF;
  --accent-soft: #DEE7FB;
  --plate: #D99A00;
  --good: #15803D;
  --good-soft: #DCF2E3;
  --warn: #B45309;
  --warn-soft: #FBEBD7;
  --bad: #B42318;
  --scrim: rgba(19, 23, 28, .45);
  --f-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1216; --surface: #171B21; --surface-2: #1E232A; --ink: #E8ECF0; --muted: #97A2AE; --line: #2A313A;
    --accent: #7EA2FF; --accent-ink: #0B1020; --accent-soft: #1D2A4A; --plate: #F2B934;
    --good: #4ADE80; --good-soft: #15301F; --warn: #FBBF24; --warn-soft: #33270F; --bad: #F87171; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1216; --surface: #171B21; --surface-2: #1E232A; --ink: #E8ECF0; --muted: #97A2AE; --line: #2A313A;
  --accent: #7EA2FF; --accent-ink: #0B1020; --accent-soft: #1D2A4A; --plate: #F2B934;
  --good: #4ADE80; --good-soft: #15301F; --warn: #FBBF24; --warn-soft: #33270F; --bad: #F87171; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.brand-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.icon-btn { margin-left: auto; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg, .tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px calc(150px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { display: flex; flex-direction: column; gap: 14px; }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }

h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 23px; line-height: 1.1; margin: 0; text-wrap: balance; }
h3 { font-weight: 600; font-size: 17px; line-height: 1.25; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 20px; }
li + li { margin-top: 4px; }
a { color: var(--accent); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.head { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.between > * { min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.quiet { background: transparent; }

.btn { appearance: none; border: 1px solid var(--accent); border-radius: 10px; min-height: 48px; padding: 0 18px; font: 600 16px var(--f-body); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

.field { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 500 17px var(--f-body); padding: 0 12px; }
textarea.field { padding: 10px 12px; min-height: 48px; resize: vertical; line-height: 1.4; }
select.field { appearance: auto; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.form .full { grid-column: 1 / -1; }
.inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 0 12px; min-height: 36px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 520px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; line-height: 1; }
.stat .v small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
.good { color: var(--good); }
.warn { color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.blue { background: var(--accent-soft); color: var(--accent); }

/* A weight-stack plate with its pin hole: the target load for a lift. */
.plate { display: inline-flex; align-items: center; gap: 7px; padding: 2px 10px 2px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.plate i { width: 9px; height: 9px; border-radius: 50%; background: var(--plate); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .18); }
.plate.up { border-color: var(--good); }
.plate.none { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.day b { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 15px; color: var(--muted); }
.day.on b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day.today b { border-color: var(--ink); color: var(--ink); }
.day.on.today b { color: var(--accent-ink); }

.plan { list-style: none; padding: 0; display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); margin: 0; }
.plan li:first-child { border-top: 0; padding-top: 0; }
.plan .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.ex { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.ex:first-of-type { border-top: 0; padding-top: 0; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ex-head > div:first-child { min-width: 0; }
.ex-tools { display: flex; gap: 6px; flex-shrink: 0; }
.hint { font-size: 14px; color: var(--muted); }
.hint.up { color: var(--good); font-weight: 600; }
.mine { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.set.one { grid-template-columns: 24px minmax(0, 1fr) auto 48px; }
.set .n { font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--muted); text-align: center; }
.set .u { font-size: 13px; color: var(--muted); }
.set .field::placeholder { color: var(--muted); opacity: .45; }
.set .field { text-align: center; font-family: var(--f-display); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 6px; }
.tick { width: 48px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.tick svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.set.done .tick { background: var(--good); border-color: var(--good); }
.set.done .tick svg { stroke: var(--surface); }
.set.done .field { color: var(--muted); }

.check { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-child { border-top: 0; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.check span small { display: block; color: var(--muted); font-size: 13px; }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 500 10px var(--f-body); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .area { fill: var(--accent-soft); opacity: .7; }
.chart .avg { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.chart .pt { fill: var(--accent); opacity: .35; }
.chart .goal { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .goal-t { fill: var(--good); font-weight: 600; }
.chart .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .end-t { fill: var(--ink); font: 600 12px var(--f-display); }
.spark { width: 84px; height: 28px; display: block; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark circle { fill: var(--accent); }

.lifts { display: flex; flex-direction: column; }
.lift { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.lift:first-child { border-top: 0; }
.lift .delta { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; text-align: right; white-space: nowrap; }

.cal { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); gap: 5px; align-items: center; }
.cal .h { font-size: 11px; color: var(--muted); text-align: center; }
.cal .wk { font-size: 11px; color: var(--muted); }
.cal .c { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.cal .c.on { background: var(--accent); border-color: var(--accent); }
.cal .c.hab::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--plate); right: 3px; bottom: 3px; }
.cal .c.future { opacity: .35; }
.cal .c.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.scale-q { display: flex; flex-direction: column; gap: 6px; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--f-display); font-size: 18px; font-weight: 600; color: var(--muted); }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.notes { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.notes li { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 15px; }
.notes li.change { background: var(--accent-soft); }
.review { white-space: pre-wrap; font-size: 15px; background: var(--surface-2); border-radius: 10px; padding: 12px; }

details.guide { border-top: 1px solid var(--line); }
details.guide:first-of-type { border-top: 0; }
details.guide summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; }
details.guide summary::-webkit-details-marker { display: none; }
details.guide summary .chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; }
details.guide[open] summary .chev { transform: rotate(-135deg); }
.guide-body { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
.guide-body h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; padding: 0 6px; }
.rhythm { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); gap: 5px; align-items: center; }
.rhythm .h, .rhythm .wk { font-size: 11px; color: var(--muted); }
.rhythm .h { text-align: center; }
.rh { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.rh.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.chat-log { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.note { align-self: center; max-width: 100%; font-size: 13px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 999px; padding: 6px 12px; }
.msg.wait { color: var(--muted); font-style: italic; }
.chat-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }

.timer { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--ink); color: var(--bg); }
.timer-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.timer-t { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; line-height: 1; min-width: 64px; }
.timer-l { font-size: 14px; flex: 1; min-width: 0; }
.timer button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 8px; min-height: 36px; padding: 0 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.timer-bar { height: 3px; background: var(--plate); width: 0; }
.timer.over { background: var(--accent); color: var(--accent-ink); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { appearance: none; border: 0; background: transparent; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab[aria-current="page"] { color: var(--accent); }

.sheet { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { background: var(--surface); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 16px 16px 0 0; padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.skeleton { padding: 40px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
}
</style>

<header class="top">
  <div class="top-in">
    <div>
      <div class="brand">First Rep Coach</div>
      <div class="brand-sub" id="hdr-sub">Gym log and coach</div>
    </div>
    <button class="icon-btn" id="btn-settings" data-act="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section id="p-today" class="panel"><div class="skeleton">Loading your log…</div></section>
  <section id="p-progress" class="panel" hidden></section>
  <section id="p-machines" class="panel" hidden></section>
  <section id="p-coach" class="panel" hidden></section>
</main>

<div id="timer" class="timer" hidden>
  <div class="timer-bar" id="timer-bar"></div>
  <div class="timer-in">
    <div class="timer-t" id="timer-t">1:30</div>
    <div class="timer-l" id="timer-l">Rest, then the next set</div>
    <button data-act="rest-add">+30 s</button>
    <button data-act="rest-skip">Skip</button>
  </div>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">

    <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3.5 20.5h17"/><path d="M5 16l4.5-5.5 4 3.5L19.5 6"/></svg>Progress</button>

/* ---------- derived numbers ---------- */

function niceStep(span, n = 4) { const raw = span / n; return [0.5, 1, 2, 2.5, 5, 10, 20].find(s => s >= raw) || 20; }
function weightChart() {

  const start = S.range ? addDays(D, -(S.range * 7 - 1)) : all[0].date;
  const pts = all.filter(w => w.date >= start && w.date <= D);
  if (!pts.length) return `<p class="muted small">No weigh-ins in this range.</p>`;
  const x0 = S.range ? start : pts[0].date, span = Math.max(6, daysBetween(x0, D));

  const vals = pts.map(w => w.kg).concat(avg.map(a => a.kg));

  xl.forEach((d, i) => { g += `<text x="${X(d).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 2 ? "end" : "middle"}">${fmtDate(d)}</text>`; });
  if (showGoal) g += `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(p.goalKg).toFixed(1)}" y2="${Y(p.goalKg).toFixed(1)}"/><text class="goal-t" x="${W - R + 4}" y="${(Y(p.goalKg) + 3.5).toFixed(1)}">Goal</text>`;
  const line = avg.map((a, i) => `${i ? "L" : "M"}${X(a.date).toFixed(1)} ${Y(a.kg).toFixed(1)}`).join(" ");
  const area = avg.length > 1 ? `<path class="area" d="${line} L${X(avg[avg.length - 1].date).toFixed(1)} ${Y(lo).toFixed(1)} L${X(avg[0].date).toFixed(1)} ${Y(lo).toFixed(1)} Z"/>` : "";

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight chart: daily weigh-ins as dots and the 7-day average as a line">${g}${area}<path class="avg" d="${line}"/>${dots}${end}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>7-day average</span><span><i style="background:var(--accent);opacity:.35;border-radius:50%"></i>daily weigh-in</span>${showGoal ? `<span><i style="border-top:2px dashed var(--good);height:0;border-radius:0"></i>goal</span>` : ""}</div>`;

function checkinResult() {
  const p = P(), D = today(), ci = S.ci;
  const a1 = avgEnding(D), a0 = avgEnding(addDays(D, -7));
  const n1 = windowVals(D, 7).length, n0 = windowVals(addDays(D, -7), 7).length;
  const rate = a1 != null && a0 != null && n1 >= 3 && n0 >= 3 ? round1(a0 - a1) : null;
  const wks = Math.floor(daysBetween(p.startDate, D) / 7);
  const prev = lastCheckin();
  const notes = [], changes = {};
  if (rate == null) notes.push({ t: "Not enough weigh-ins to compare this week with last. Weigh in at least 3 mornings a week." });
  else if (wks < 2) notes.push({ t: `Average down ${fmt1(rate)} kg. The first two weeks include water loss, so no changes yet.` });
  else if (rate < 0.25) {
    if (prev && prev.rate != null && prev.rate < 0.25) {
      changes.kcal = Math.max(p.sex === "f" ? 1400 : 1800, p.kcal - 150);
      notes.push({ t: `Two slow weeks in a row (${fmt1(rate)} kg this week). Calories go from ${thousands(p.kcal)} to ${thousands(changes.kcal)}. That's about one slice of bread less a day.`, c: true });
      if (p.foodMode !== "count") { changes.foodMode = "count"; notes.push({ t: "Switch to counting calories for a few weeks. The habit checklist alone isn't moving the scale.", c: true }); }
    } else notes.push({ t: `Slow week: ${fmt1(rate)} kg. Nothing changes yet. If next week is slow too, calories drop by 150.` });
  } else if (rate > 1.0) {
    changes.kcal = Math.min(3200, p.kcal + 150);
    notes.push({ t: `Losing fast: ${fmt1(rate)} kg in a week. Calories go up to ${thousands(changes.kcal)} so you keep your muscle and energy.`, c: true });
  } else notes.push({ t: `On track: down ${fmt1(rate)} kg on average. Keep doing exactly this.` });
  const run_down = (ci.energy <= 2 && ci.soreness >= 4) || (ci.sleep <= 2 && prev && prev.sleep <= 2);
  if (run_down && !deloadOn()) { changes.deloadUntil = addDays(D, 7); notes.push({ t: "You're run down. Next 7 days are an easy week: one set fewer and about 15% lighter.", c: true }); }
  if (ci.hunger >= 4) notes.push({ t: "Very hungry: add vegetables and protein to each meal before cutting anything else, and check your sleep." });
  const nW = doneWorkouts().filter(w => w.date > addDays(D, -7)).length;
  if (nW < 3) notes.push({ t: `${nW} workout${nW === 1 ? "" : "s"} in the last 7 days. Pick your 3 gym days for next week now and put them in your calendar.` });
  return { date: D, rate, avgThis: a1 != null ? round1(a1) : null, avgPrev: a0 != null ? round1(a0) : null, ...ci, workouts: nW, notes: notes.map(n => (n.c ? "Change: " : "") + n.t), changes, _view: notes };
}

      const ex = alt || slot, e = EX[ex];
      if (e.unit !== EX[it.ex].unit && e.rng) { it.lo = e.rng[0]; it.hi = e.rng[1]; }
      else if (e.unit !== EX[it.ex].unit) { const base = PROGRAM[Math.min(phaseNo(), 2)]; const row = [...base.A, ...base.B].find(r => r[0] === slot); if (row) { it.lo = row[2]; it.hi = row[3]; } }

let audio = null;
function beep() {

function tick() {
  const now = Date.now();

    if (left > 0) {

      $("#timer-bar").style.width = `${Math.min(100, (el / T.target) * 100)}%`; box.classList.remove("over");
    } else {

      $("#timer-bar").style.width = "100%"; box.classList.add("over");
      if (!T.beeped) { T.beeped = true; beep(); }
      if (-left > 900) stopRest();
    }
  }
  const aw = S.loaded.size >= COLS.length ? activeWorkout() : null;
  const wc = document.getElementById("w-clock");
  if (wc && aw) wc.textContent = mmss(Math.max(0, Math.floor((now - aw.startedAt) / 1000)));
  const ht = document.getElementById("hold-t");

}

}

function startWorkout(session) {
  if (activeWorkout()) { toast("Finish or discard the current workout first."); return; }
  const D = today(), ph = phaseNo();
  const items = programFor(ph, session).map(c => {
    const sg = suggest(c);
    return { slot: c.slot, ex: c.ex, lo: c.lo, hi: c.hi, sets: Array.from({ length: c.sets }, () => ({ kg: sg.kg, reps: null, done: false })) };
  });
  let id = `${D}-${session}`, n = 2; while (S.workouts[id]) id = `${D}-${session}-${n++}`;
  put("workouts", id, { id, date: D, session, phase: ph, status: "active", startedAt: Date.now(), items, cardio: { warmup: false, finisher: false } });
  keepAwake(true); window.scrollTo({ top: 0 });
}
function lastDoneAt(w) { let t = 0; w.items.forEach(it => it.sets.forEach(x => { if (x.done && x.at > t) t = x.at; })); return t; }
function markDone(w, i, j, reps, kg) {
  const it = w.items[i], s = it.sets[j], now = Date.now(), prev = lastDoneAt(w);
  if (kg != null) {
    s.kg = kg;
    for (let k = j + 1; k < it.sets.length; k++) if (!it.sets[k].done) { it.sets[k].kg = kg; delete S.draft[`w-${i}-${k}-kg`]; }
  }
  s.reps = reps; s.done = true; s.at = now;
  s.rest = prev && now - prev < 1200000 ? Math.round((now - prev) / 1000) : null;
  startRest(it.sets.every(x => x.done) ? 120 : restFor(it.ex));
}
function toggleSet(i, j) {
  const w = clone(activeWorkout()); if (!w) return;
  const it = w.items[i], s = it.sets[j], e = EX[it.ex];
  const kId = `w-${i}-${j}-kg`, rId = `w-${i}-${j}-r`;
  if (s.done) { s.done = false; delete s.at; delete s.rest; }
  else {
    const reps = num($("#" + rId).value);
    if (!(reps > 0)) { $("#" + rId).focus(); toast(e.unit === "s" ? "Enter how many seconds you held" : "Enter how many reps you did"); return; }
    let kg = null;
    if (e.unit === "kg") {
      kg = num($("#" + kId).value);
      if (kg == null || kg < 0) { $("#" + kId).focus(); toast("Enter the weight you used"); return; }
    }
    markDone(w, i, j, reps, kg);
  }
  delete S.draft[kId]; delete S.draft[rId];
  put("workouts", w.id, w);
}
function toggleHold(i) {
  const aw = activeWorkout(); if (!aw) return;
  if (!T.hold) {
    const it = aw.items[i], sg = suggest(it);
    T.hold = { i, start: Date.now(), target: sg.target || it.lo, beeped: false }; stopRest(); render(); return;
  }
  const secs = Math.round((Date.now() - T.hold.start) / 1000), hi = T.hold.i; T.hold = null;
  const w = clone(aw), it = w.items[hi], j = it.sets.findIndex(x => !x.done);
  if (j < 0 || secs < 1) { render(); return; }
  delete S.draft[`w-${hi}-${j}-r`];
  markDone(w, hi, j, secs, null); put("workouts", w.id, w); toast(`Set ${j + 1}: held ${secs} s`);
}
function finishWorkout() {
  const w = clone(activeWorkout()); if (!w) return;
  const done = w.items.reduce((n, it) => n + it.sets.filter(s => s.done).length, 0);
  if (!done) { toast("Log at least one set first, or discard the workout."); return; }
  w.status = "done"; w.finishedAt = Date.now(); w.durationSec = Math.round((w.finishedAt - w.startedAt) / 1000);
  Object.keys(S.draft).filter(k => k.startsWith("w-")).forEach(k => delete S.draft[k]);
  put("workouts", w.id, w).then(() => {
    const ups = w.items.filter(it => suggest({ ...it, sets: it.sets }).up).length;
    toast(ups ? `Workout saved. ${ups} lift${ups > 1 ? "s" : ""} go${ups > 1 ? "" : "es"} up next time.` : "Workout saved. Nice work.");
  });
  stopRest(); T.hold = null; keepAwake(false); window.scrollTo({ top: 0 });
}

    S.confirmDiscard = false; const w = activeWorkout(); if (w) remove("workouts", w.id); stopRest(); T.hold = null; keepAwake(false); toast("Workout deleted");
  }
  else if (act === "guide") openSheet(`<div class="between"><h2>${esc(EX[b.dataset.ex].name)}</h2><button class="btn ghost sm" data-act="close">Close</button></div><div class="guide-body">${guideBody(b.dataset.ex, "sheet")}</div>`);
  else if (act === "swap") openSheet(swapHTML(+b.dataset.i));
  else if (act === "do-swap") { applySwap(b.dataset.slot, b.dataset.ex === b.dataset.slot ? null : b.dataset.ex); closeSheet(); toast(`Swapped to ${EX[b.dataset.ex].name}`); }
  else if (act === "unswap") { applySwap(b.dataset.slot, null); closeSheet(); toast("Original exercise restored"); }
  else if (act === "close") closeSheet();
  else if (act === "settings") { if (P()) openSheet(settingsHTML()); }
  else if (act === "recalc") { const t = computeTargets({ ...P(), startKg: currentWeight() || P().startKg }); saveProfile(t); closeSheet(); toast(`Targets: ${thousands(t.kcal)} kcal, ${t.protein} g protein`); }
  else if (act === "end-deload") { saveProfile({ deloadUntil: null }); closeSheet(); toast("Easy week ended"); }
  else if (act === "rest-add") { if (T.on) { const el = Math.ceil((Date.now() - T.start) / 1000); T.target = Math.max(T.target, el) + 30; T.beeped = false; tick(); } }
  else if (act === "rest-skip") stopRest();
  else if (act === "rest-go") startRest(+b.dataset.v);
  else if (act === "hold") toggleHold(+b.dataset.i);
  else if (act === "why") openSheet(whyHTML());
  else if (act === "del-weight") {
    if (S.confirmDel !== b.dataset.d) { S.confirmDel = b.dataset.d; render(); return; }
    S.confirmDel = null; remove("weights", b.dataset.d); toast("Weigh-in deleted");
  }
  else if (act === "range") { S.range = +b.dataset.v; render(); }
  else if (act === "vphase") { S.viewPhase = +b.dataset.v; render(); }
  else if (act === "area") { S.area = b.dataset.v; delete S.draft["m-q"]; render(); }
  else if (act === "sex") { S.draft.sex = b.dataset.v; render(); }
  else if (act === "ci") { S.ci[b.dataset.k] = +b.dataset.v; render(); }
  else if (act === "ci-preview") { S.ciPreview = true; render(); }
  else if (act === "ci-save") {
    const r = checkinResult(); const { _view, changes, ...doc } = r;
    put("checkins", r.date, { ...doc, changes });
    if (Object.keys(changes).length) saveProfile(changes);
    S.ciPreview = false; S.ciOpen = false; toast(Object.keys(changes).length ? "Check-in saved and plan updated" : "Check-in saved");
  }
  else if (act === "ci-review") writeReview();
  else if (act === "ask") sendChat(b.dataset.q);
  else if (act === "stop") { if (chatCtl) chatCtl.abort(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && activeWorkout()) keepAwake(true); });

render();
initStore();
initSample();
</script>
